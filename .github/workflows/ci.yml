name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: "CourtTime Player View"

jobs:
  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Web only. The mobile app is installed explicitly by the job that needs
      # it — a root postinstall used to pull it in here and on the deploy host,
      # which meant a React Native dependency conflict could fail a web deploy.
      - run: npm ci --include=dev
      - run: npm test

  mobile:
    name: Mobile typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --include=dev
      # Installs from mobile/package-lock.json, so a resolution conflict fails
      # here rather than reaching production.
      - run: npm --prefix mobile ci
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
